[package]
name = "emu-horizon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "High-level emulation of the Horizon kernel: memory, handles, SVCs, homebrew boot"

[dependencies]
emu-cpu = { path = "../emu-cpu" }
emu-memory = { path = "../emu-memory" }
emu-loader = { path = "../emu-loader" }
emu-gpu = { path = "../emu-gpu" }
emu-jit = { path = "../emu-jit", optional = true }

[features]
# Run guest code with the dynarmic JIT (needs CMake and a C++20 compiler).
jit = ["dep:emu-jit"]
