[package]
name = "emu-run"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs test programs on the emulated CPU"

[dependencies]
emu-cpu = { path = "../emu-cpu" }
emu-memory = { path = "../emu-memory" }
emu-loader = { path = "../emu-loader" }
emu-horizon = { path = "../emu-horizon" }
png = "0.17"
minifb = { version = "0.28", optional = true }

[features]
# Show presented frames in a window (minifb). Off by default so headless
# builds (CI, servers) need no windowing libraries.
window = ["dep:minifb"]
