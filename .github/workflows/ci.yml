name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The toolchain version comes from rust-toolchain.toml.
      - run: rustup toolchain install && rustup show active-toolchain
      # Lavapipe (Mesa's software Vulkan) so the Vulkan backend tests
      # run; elsewhere they skip when no Vulkan device exists.
      - name: Install a Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Release: the graphics test runs ~10^8 guest instructions.
      - run: cargo test --release
      - name: Build with the window front end
        if: runner.os == 'Windows'
        run: cargo clippy --release -p emu-run --features window -- -D warnings

  difftest:
    # Cross-checks the interpreter against Unicorn on random instructions.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      - run: sudo apt-get install -y llvm
      - run: pip install unicorn==2.1.4
      - run: cargo build --release --example difftest_runner
      - run: python3 tools/difftest.py --cases 20000 --seed ${{ github.run_number }}
